<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema Portal Docente</title>
  <link rel="stylesheet" href="src/css/iniciostyle.css">
</head>
<body>

  <!-- Lado izquierdo: panel azul (en el celular se muestra arriba) -->
  <div class="lado-azul">
    <img src="src/assets/img/Historia.jpg" alt="Imagen de fondo campus UEES" class="imagen-fondo">

    <h1>SISTEMA PORTAL DOCENTE</h1>
  </div>

  <!-- Lado derecho: logo y formulario -->
  <div class="lado-form">
    <img src="src/assets/img/logo_uees.png" alt="Logo de la universidad" class="logo-uees">
    <p class="logo">EDUCACIÓN DE CALIDAD<br>CON VALORES CRISTIANOS</p>

    <form class="tarjeta" onsubmit="return ingresar('usuario1', 'clave1')">
      <h2>Digite sus credenciales</h2>

      <label for="usuario1">Usuario</label>
      <input type="text" id="usuario1" placeholder="Usuario">

      <label for="clave1">Contraseña</label>
      <input type="password" id="clave1" placeholder="Contraseña">

      <label class="recordar"><input type="checkbox"> Recordarme</label>

      <button type="submit">Ingresar</button>
    </form>
  </div>

  <script src="src/js/iniciojavascript.js"></script>
</body>
</html>
