<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Portal Docente</title>

    <link rel="stylesheet" href="src/css/iniciostyle.css">
</head>
<body>

    <!-- Lado izquierdo -->
    <div class="lado-azul">
        <img
            src="src/assets/img/Historia.jpg"
            alt="Imagen de fondo campus UEES"
            class="imagen-fondo">

        <h1>SISTEMA PORTAL DOCENTE</h1>
    </div>

    <!-- Lado derecho -->
    <div class="lado-form">

        <img
            src="src/assets/img/logo_uees.png"
            alt="Logo UEES"
            class="logo-uees">

        <p class="logo">
            EDUCACIÓN DE CALIDAD<br>
            CON VALORES CRISTIANOS
        </p>

        <form class="tarjeta" id="loginForm">

            <h2>Digite sus credenciales</h2>

           <form id="loginForm">
  <label for="usuario1">Usuario</label>
  <input type="text" id="usuario1" inputmode="numeric" placeholder="Ingrese su DUI" required>

  <label for="clave1">Contraseña</label>
  <input type="password" id="clave1" placeholder="Ingrese su contraseña" required>

   <label class="recordar">
                <input
                    type="checkbox"
                    id="recordarme"
                    name="recordarme">
                Recordarme
            </label>

  <button type="submit">Ingresar</button>
</form>

        </form>

    </div>

    <script src="src/js/api-config.js"></script>
    <script src="src/js/iniciojavascript.js"></script>

</body>
</html>
